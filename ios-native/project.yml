name: BuildlyNative
options:
  bundleIdPrefix: com.nomapps
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../ios/App/App/Assets.xcassets
      - path: ../ios/App/App/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nomapps.buildly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: '1,2'
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Nom DIY Beta
        UILaunchScreen: {}
        NSCameraUsageDescription: Take a photo of your space for your project.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
schemes:
  App:
    build:
      targets:
        App: all
    archive:
      config: Release
